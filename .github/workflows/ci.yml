name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Fase 1 · ruff
        working-directory: data_extraction
        run: uvx ruff@0.16.7 check --select E4,E7,E9,F src tests

      - name: Verificar que los lockfiles están al día
        run: |
          uv lock --check --directory data_analysis
          uv lock --check --directory data_extraction

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: data_extraction/uv.lock

      - name: Liberar espacio en disco
        # Las ruedas de CUDA de torch cu126 ocupan varios GB.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Instalar el entorno exacto del lockfile
        working-directory: data_extraction
        run: uv sync --frozen

      - name: Ejecutar la suite
        working-directory: data_extraction
        run: uv run --frozen pytest
